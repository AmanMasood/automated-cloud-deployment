#cloud-config
# Bootstraps a fresh Ubuntu 24.04 EC2 instance: Docker, Nginx, Certbot, firewall, deploy user.
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - nginx
  - certbot
  - python3-certbot-nginx
  - ufw
  - fail2ban

users:
  - default
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:/usr/bin/systemctl reload nginx"]
    ssh_authorized_keys:
      - ${DEPLOY_PUBLIC_KEY}

runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker deploy
  - systemctl enable --now docker
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw allow "Nginx Full"
  - ufw --force enable
  - systemctl enable --now fail2ban
  - mkdir -p /opt/app && chown deploy:deploy /opt/app
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl reload nginx

final_message: "Bootstrap finished after $UPTIME seconds"
